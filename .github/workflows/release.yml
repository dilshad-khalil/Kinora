# Every push to main builds the Windows installer, a .deb (Ubuntu, Debian, Zorin) and an Arch
# package (Omarchy), and publishes them together as a new GitHub release.
# The version comes from the latest tag: patch bump by default, put [minor] or [major] in the
# commit message to bump those instead. Old releases are never replaced.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".vscode/**"
  workflow_dispatch:

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version

      - name: Next version
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          latest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=$(node -p "require('./src-tauri/tauri.conf.json').version")
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$MESSAGE" in
              *"[major]"*) next="$((major + 1)).0.0" ;;
              *"[minor]"*) next="$major.$((minor + 1)).0" ;;
              *)           next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build installer
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Built on the oldest Ubuntu that has webkit2gtk-4.1, so the .deb also installs on newer ones.
  deb:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.version.outputs.version }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build .deb
        run: npm run tauri build -- --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb

  # makepkg refuses to run as root, so the build happens as a throwaway user.
  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm base-devel git nodejs npm rust webkit2gtk-4.1 gtk3 gtk-layer-shell libayatana-appindicator

      - uses: actions/checkout@v5

      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'cd packaging/arch && makepkg -f'

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/kinora-*.pkg.tar.zst

  publish:
    needs: [version, windows, deb, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rm -f dist/kinora-debug-*
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kinora $VERSION" \
            --generate-notes \
            dist/*
